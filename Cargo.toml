[package]
default-run = "ybm"
description = "A self-contained scripting language for Agent Skills"
edition = "2024"
homepage = "https://github.com/smartcrabai/yabumi"
license = "MIT"
name = "yabumi"
repository = "https://github.com/smartcrabai/yabumi"
version = "0.1.0"

[features]
default = []
test-fixtures = []

[[bin]]
name = "ybm"
path = "src/main.rs"

[[bin]]
name = "yabumi"
path = "src/bin/yabumi.rs"

[[bin]]
name = "proc_fixture"
path = "tests/fixtures/proc_fixture/main.rs"
required-features = ["test-fixtures"]

[dependencies]
indexmap = "2"
regex = "1"
ureq = { version = "3", default-features = false, features = [
  "rustls",
  "gzip",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.dist]
inherits = "release"

[lints.clippy]
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
