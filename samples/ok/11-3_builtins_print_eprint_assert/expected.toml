# Follows the schema in SAMPLES_PLAN.md section 1.3.
# Verifies SPEC 11.3's 4-type overload of print/eprint and the stdout/stderr separation.
# Both stdout/stderr are compared against a fixed string with mode = "exact".

[[case]]
id = "run_ok"
entry = "entry_main.ybm"
cmd = "run"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = ""
stdout = { mode = "exact", value = "hello\n42\n3.5\ntrue\n" }
stderr = { mode = "exact", value = "oops\n7\n1.5\nfalse\n" }
doc_blocks = []
requires_env = []
notes = "Verifies via exact match that print(str/int/float/bool) writes to stdout and eprint(str/int/float/bool) writes to stderr, each with a trailing newline."
