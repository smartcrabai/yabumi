# Follows the schema in SAMPLES_PLAN.md section 1.3.
# Verifies SPEC 11.2 / STDLIB.md §7 env's get/set/args/stdin.
# Via the stdin_file setting, the harness feeds stdin_fixture.txt into the process's standard input.

[[case]]
id = "run_ok"
entry = "entry_main.ybm"
cmd = "run"
args = ["foo", "bar"]
stdin_file = "stdin_fixture.txt"
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = ""
stdout = { mode = "exact", value = "env sample done\n" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "Verifies env.get(unset)=None, env.get after env.set=Some, env.args()=[\"foo\",\"bar\"], and env.stdin() reading the fixed fixture."
