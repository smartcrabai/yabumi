# Follows the schema in SAMPLES_PLAN.md section 1.3.
# Verifies the success cases of SPEC 7.5 / D-STDPOL-01's 1-argument and 2-argument assert forms.

[[case]]
id = "run_ok"
entry = "entry_main.ybm"
cmd = "run"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = ""
stdout = { mode = "exact", value = "all assertions passed\n" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "Calls both assert(cond) and assert(cond, msg) multiple times with conditions that succeed. Since all succeed, exit 0."
