# Follows the schema in SAMPLES_PLAN.md section 1.3.
# An adaptation of SPEC §15's overall sample (SAMPLES_PLAN.md §2 pattern 3).
# typecheck_only is check-only (never run, since it uses a real http.get path);
# runnable verifies through actual execution with literal data.

[[case]]
id = "typecheck_only"
entry = "entry_showcase_typecheck_only.ybm"
cmd = "check"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = ""
stdout = { mode = "exact", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "The full version calling mod_repo.ybm's fetch_repos (which uses a real http.get). Since it depends on the network, only type/effect checking is verified; it is never run."

[[case]]
id = "runnable"
entry = "entry_showcase_runnable.ybm"
cmd = "run"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = ""
stdout = { mode = "exact", value = "done: 3 repos\n" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "Runs the filter/flat_map/sort_by/rev/take pipeline on deterministic literal Repo data, and asserts through the dict wrap via {\"repos\": top} (D-STDPOL-09), toml.encode, fs.write, and the decode round-trip."
