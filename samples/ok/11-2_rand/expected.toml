# Follows the schema in SAMPLES_PLAN.md section 1.3.
# Verifies SPEC 11.2 / STDLIB.md §10 rand's deterministic int/choice/shuffle behavior
# via degenerate intervals and a single-element list.

[[case]]
id = "run_ok"
entry = "entry_main.ybm"
cmd = "run"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = ""
stdout = { mode = "exact", value = "rand sample done\n" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "rand.int(5, 6) is always 5; rand.choice on a single-element list is always Some(that element); rand.shuffle never changes the order."
