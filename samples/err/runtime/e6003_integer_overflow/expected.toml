# Verifies: SPEC §7.4 / DECISIONS D-ERR-04 item 4, D-DIAG-02 (E6003)
# Confirms that both an i64-range arithmetic overflow and an out-of-range int(x: float)
# conversion terminate immediately with E6003.

[[case]]
id = "arithmetic_overflow"
entry = "entry_arithmetic_overflow.ybm"
cmd = "run"
args = []
stdin_file = ""
exit_code = 1
diagnostics = ["E6003"]
