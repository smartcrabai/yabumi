notes = "Confirms that the 3 independent errors -- a missing function parameter type annotation (E1002), mixed int/float arithmetic (E1050), and a match exhaustiveness violation (E1021) -- located at different positions are all reported in one check, in ascending file:line:col order (i.e. source appearance order) per D-CLI-03. Since ybm check never executes, stdout is always empty."
