# Verifies: SPEC §1/§12, DECISIONS D-CLI-02 (--apply flag position) plus
# fmt(fmt(x)) = fmt(x) idempotency across multiple fmt rules.
#
# sample.in.ybm is a practical, complete program that packs, all at once, into
# non-canonical form: D-FMT-01 (spacing around operators/commas/colons), D-FMT-03
# (a space right after #/##), D-SYN-02 (collapsing consecutive blank lines and
# normalizing the trailing newline), D-TYPE-02 (adding a trailing comma to a
# multi-line literal / removing it on a single line), D-FMT-04 (splitting a pipe of 2+
# stages), and D-SYN-05 (normalizing `.`/`|>` continuation-line indent to the base line
# + 4). sample.out.ybm is the single canonical form after every rule is applied.
#
# D-CLI-02: `ybm check <file> --apply` and `ybm check --apply <file>` are synonymous
# (the flag may go either before or after entry). cmd="check" maps to the postfix
# `ybm check <entry> --apply` form by default. The prefix case sets cmd="check" and
# args=["--apply"], instructing the harness to place the flag before entry.

[[case]]
id = "check_diff_default_read_only"
entry = "sample.in.ybm"
cmd = "check_diff"
args = []
stdin_file = ""
exit_code = 1
diagnostics = []
fmt_diff_expected = true
fmt_result_file = ""
stdout = { mode = "contains", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "Assumed command: ybm check sample.in.ybm (the read-only default). Since it's pre-formatting, there is a diff (fmt_diff_expected=true), and it exits 1 with no rewrite. Since stdout's diff-display format is unspecified by SPEC/DECISIONS, this uses mode=contains value=\"\" (not asserting the content)."

[[case]]
id = "check_apply_flag_prefix"
entry = "sample.in.ybm"
cmd = "check"
args = ["--apply"]
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = "sample.out.ybm"
stdout = { mode = "exact", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "Assumed command: ybm check --apply sample.in.ybm (the prefix form). The explicit --apply flag rewrites the non-canonical source to sample.out.ybm and exits 0."

[[case]]
id = "check_apply_rewrites_to_normal_form"
entry = "sample.in.ybm"
cmd = "check"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = "sample.out.ybm"
stdout = { mode = "exact", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "ybm check --apply sample.in.ybm. Type-checking and the effect check succeed, and the content after fmt byte-matches sample.out.ybm."

[[case]]
id = "check_diff_none_after_normalization"
entry = "sample.out.ybm"
cmd = "check_diff"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = ""
stdout = { mode = "exact", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "sample.out.ybm is already canonical, so ybm check reports no diff and exits 0."

[[case]]
id = "check_on_normalized_form_is_noop"
entry = "sample.out.ybm"
cmd = "check"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = "sample.out.ybm"
stdout = { mode = "exact", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "Running ybm check --apply on sample.out.ybm also byte-matches itself (a direct verification of fmt(fmt(x)) = fmt(x))."
