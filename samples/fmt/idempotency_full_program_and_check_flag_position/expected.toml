# Verifies: SPEC §1/§12, DECISIONS D-CLI-02 (--check flag position) plus
# fmt(fmt(x)) = fmt(x) idempotency across multiple fmt rules.
#
# sample.in.ybm is a practical, complete program that packs, all at once, into
# non-canonical form: D-FMT-01 (spacing around operators/commas/colons), D-FMT-03
# (a space right after #/##), D-SYN-02 (collapsing consecutive blank lines and
# normalizing the trailing newline), D-TYPE-02 (adding a trailing comma to a
# multi-line literal / removing it on a single line), D-FMT-04 (splitting a pipe of 2+
# stages), and D-SYN-05 (normalizing `.`/`|>` continuation-line indent to the base line
# + 4). sample.out.ybm is the single canonical form after every rule is applied.
#
# D-CLI-02: `ybm check <file> --check` and `ybm check --check <file>` are synonymous
# (the flag may go either before or after entry). cmd="check_diff" already means, by
# definition, `ybm check <entry> --check` (the postfix form) (SAMPLES_PLAN.md §1.3), so
# the postfix case can leave args=[] as-is. Since the schema has no dedicated field for
# the prefix form (`ybm check --check <entry>`), only the prefix case sets
# args=["--check"], as a note to harness implementers making explicit that this means
# "call with the flag placed before entry, rather than cmd's default postfix form".

[[case]]
id = "check_diff_flag_postfix"
entry = "sample.in.ybm"
cmd = "check_diff"
args = []
stdin_file = ""
exit_code = 1
diagnostics = []
fmt_diff_expected = true
fmt_result_file = ""
stdout = { mode = "contains", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "Assumed command: ybm check sample.in.ybm --check (the postfix form, placing the flag after entry -- exactly cmd=check_diff's default form). Valid syntax per D-CLI-02. Since it's pre-formatting, there is a diff (fmt_diff_expected=true), and it exits 1 with no rewrite. Since stdout's diff-display format is unspecified by SPEC/DECISIONS, this uses mode=contains value=\"\" (not asserting the content)."

[[case]]
id = "check_diff_flag_prefix"
entry = "sample.in.ybm"
cmd = "check_diff"
args = ["--check"]
stdin_file = ""
exit_code = 1
diagnostics = []
fmt_diff_expected = true
fmt_result_file = ""
stdout = { mode = "contains", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "Assumed command: ybm check --check sample.in.ybm (the prefix form, placing the flag before entry). args=[\"--check\"] is used as an instruction to the harness meaning \"for this case only, call with the prefix form rather than cmd=check_diff's default postfix form\" (a substitute representation, since the schema has no dedicated field for flag position). This case's claim is that, per D-CLI-02, its result (exit_code / fmt_diff_expected) exactly matches the postfix case's."

[[case]]
id = "check_rewrites_in_place_to_normal_form"
entry = "sample.in.ybm"
cmd = "check"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = "sample.out.ybm"
stdout = { mode = "exact", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "ybm check sample.in.ybm. Type-checking and the effect check succeed, and the content after in-place fmt byte-matches sample.out.ybm."

[[case]]
id = "check_diff_none_after_normalization"
entry = "sample.out.ybm"
cmd = "check_diff"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = ""
stdout = { mode = "exact", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "sample.out.ybm is already canonical, so --check reports no diff and exits 0."

[[case]]
id = "check_on_normalized_form_is_noop"
entry = "sample.out.ybm"
cmd = "check"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = "sample.out.ybm"
stdout = { mode = "exact", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "Running check's in-place rewrite on sample.out.ybm also byte-matches itself (a direct verification of fmt(fmt(x)) = fmt(x))."
