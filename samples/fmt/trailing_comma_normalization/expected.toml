# Expected results for fmt/trailing_comma_normalization
# Verifies: SPEC §3.2/§12, DECISIONS D-TYPE-02 (adds a trailing comma to a multi-line
# list literal / function call, removes it on a single line)

[[case]]
id = "check_normalizes_trailing_commas"
entry = "sample.in.ybm"
cmd = "check"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = "sample.out.ybm"
stdout = { mode = "contains", value = "" }
stderr = { mode = "contains", value = "" }
doc_blocks = []
requires_env = []
notes = "A trailing comma is added after the final element of a multi-line list literal / function call, and removed from a single-line list literal / function call (D-TYPE-02)."

