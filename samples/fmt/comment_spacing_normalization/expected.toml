# Expected results for fmt/comment_spacing_normalization
# Verifies: SPEC §2/§12, DECISIONS D-FMT-03 (a space is forced right after `#`/`##`,
# and the space between a trailing comment and the code body is normalized)

[[case]]
id = "check_normalizes_comment_spacing"
entry = "sample.in.ybm"
cmd = "check"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = "sample.out.ybm"
stdout = { mode = "contains", value = "" }
stderr = { mode = "contains", value = "" }
doc_blocks = []
requires_env = []
notes = "A leading comment (#), a doc comment (##), and a trailing comment all get exactly 1 half-width space added right after the marker (D-FMT-03). Operator spacing (D-FMT-01), such as around x*2, is normalized at the same time."

[[case]]
id = "check_diff_detects_nonstandard_comment_spacing"
entry = "sample.in.ybm"
cmd = "check_diff"
args = []
stdin_file = ""
exit_code = 1
diagnostics = []
fmt_diff_expected = true
fmt_result_file = ""
stdout = { mode = "contains", value = "" }
stderr = { mode = "contains", value = "" }
doc_blocks = []
requires_env = []
notes = "ybm check judges the non-canonical form as having a diff and exits 1 (D-CLI-02)."

[[case]]
id = "check_diff_idempotent_on_canonical_form"
entry = "sample.out.ybm"
cmd = "check_diff"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = ""
stdout = { mode = "contains", value = "" }
stderr = { mode = "contains", value = "" }
doc_blocks = []
requires_env = []
notes = "Against sample.out.ybm, already in canonical form, there is no diff (fmt(fmt(x)) = fmt(x))."
