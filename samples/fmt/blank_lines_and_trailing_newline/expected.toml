# at most 1, and the file's end is unified to exactly 1 trailing newline, no trailing blank lines)

[[case]]
id = "check_collapses_blank_lines_and_trailing_newlines"
entry = "sample.in.ybm"
cmd = "check"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = "sample.out.ybm"
stdout = { mode = "contains", value = "" }
stderr = { mode = "contains", value = "" }
