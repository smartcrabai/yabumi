# Verifies: SPEC §12/§13, DECISIONS D-FMT-06
# Confirms that the content of an untagged fenced block (the part enclosed in ```)
# inside a `##` doc comment is exempt from fmt (in-place rewriting by `ybm check --apply`) and
# is preserved byte-identical in its non-canonical form (spacing-rule violations such as
# `x=1+2` / `assert(x==3)`). Ordinary code outside the fence (def/return/assignment/
# assert) is formatted normally per D-FMT-01 in the same check run.

[[case]]
id = "check_leaves_fence_untouched_but_normalizes_outer_code"
entry = "sample.in.ybm"
cmd = "check"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = "sample.out.ybm"
stdout = { mode = "exact", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "ybm check --apply sample.in.ybm. Type-checking (including doc-test-block type-checking, D-DOC/§13) and the effect check succeed. The content after in-place fmt byte-matches sample.out.ybm. `x=1+2`/`assert(x==3)` inside the fence are preserved as-is from the source (non-canonical form); only the `add`/`result`/`assert` calls outside the fence are formatted per D-FMT-01 (D-FMT-06). Since check never executes, stdout/stderr are empty."

[[case]]
id = "check_diff_reports_diff_from_outer_code_only"
entry = "sample.in.ybm"
cmd = "check_diff"
args = []
stdin_file = ""
exit_code = 1
diagnostics = []
fmt_diff_expected = true
fmt_result_file = ""
stdout = { mode = "contains", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "ybm check sample.in.ybm. Since the ordinary-code part (def add, etc.) is in non-canonical form, there is a diff, and it exits 1 with no rewrite. Since stdout's diff-display format is unspecified by SPEC/DECISIONS, this uses mode=contains value=\"\" (not asserting the content)."

[[case]]
id = "check_diff_none_after_normalization"
entry = "sample.out.ybm"
cmd = "check_diff"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = ""
stdout = { mode = "exact", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "In sample.out.ybm the ordinary code is already canonical, and the fence content remains non-canonical as originally, so no further diff arises (fmt doesn't evaluate fence content, so ybm check reports no diff and exits 0). Confirms fmt(fmt(x)) = fmt(x)."

[[case]]
id = "check_on_normalized_form_is_noop"
entry = "sample.out.ybm"
cmd = "check"
args = []
stdin_file = ""
exit_code = 0
diagnostics = []
fmt_diff_expected = false
fmt_result_file = "sample.out.ybm"
stdout = { mode = "exact", value = "" }
stderr = { mode = "exact", value = "" }
doc_blocks = []
requires_env = []
notes = "Running ybm check --apply on sample.out.ybm also byte-matches itself (idempotent, fence non-canonical form included)."
